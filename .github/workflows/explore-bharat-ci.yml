name: Explore Bharat checks
on:
  push:
    paths:
      - "explore-bharat-v2/**"
  pull_request:
    paths:
      - "explore-bharat-v2/**"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: explore-bharat-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
